name: Publish Bots Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  buildBotx64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # sha-<commit> tags give every deploy a fixed image to roll back to
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # stamped into the image so every log and trace says which build it came from
          build-args: GIT_SHA=${{ github.sha }}
          # keep pushing a plain single-platform image, which is what the host pulls today
          provenance: false

      # Disabled.  If container is recreated, the URL will change and break things.
      # May be worth looking into a API endpoint to trigger a refresh instead.

      # - name: Send POST request to auto-refresh
      #   uses: fjogeleit/http-request-action@v1
      #   with:
      #     url: ${{ secrets.PORTAINER_WEBHOOK }}
      #     method: 'POST'
      #     preventFailureOnNoResponse: true
